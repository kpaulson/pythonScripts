name: Build Cross-Platform Executables

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: spani_vdfBrowser-Windows
            asset_path: dist/spani_vdfBrowser.exe
          - os: ubuntu-latest
            artifact_name: spani_vdfBrowser-Linux
            asset_path: dist/spani_vdfBrowser
          - os: macos-latest
            artifact_name: spani_vdfBrowser-macOS
            asset_path: dist/spani_vdfBrowser

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Upgrade pip
      run: python -m pip install --upgrade pip

    - name: Install Dependencies and PyInstaller
      run: >
        pip install
        altgraph==0.17.5
        babel==2.18.0
        cdflib==1.3.12
        certifi==2026.6.17
        cffi==2.1.0
        chardet==7.4.3
        charset-normalizer==3.4.9
        colorama==0.4.6
        cryptography==49.0.0
        decorator==5.3.1
        distlib==0.4.3
        distro==1.9.0
        dnspython==2.8.0
        filelock==3.29.6
        idna==3.18
        iniparse==0.5
        Jinja2==3.1.6
        jsonpointer==3.1.1
        jwcrypto==1.5.8
        lxml==6.1.1
        MarkupSafe==3.0.3
        narwhals==2.23.0
        netaddr==1.3.0
        numpy==2.5.1
        packaging==26.2
        pandas==3.0.3
        pbr==7.0.3
        pefile==2024.8.26
        platformdirs==4.10.0
        plotly==6.9.0
        ply==3.11
        psutil==7.2.2
        pyasn1==0.6.3
        pyasn1_modules==0.4.2
        pycparser==3.0
        pyinstaller==6.22.3
        pyinstaller-hooks-contrib==2026.7
        pyparsing==3.3.2
        PyQt5==5.15.11
        PyQt5-Qt5==5.15.2
        PyQt5_sip==12.19.0
        pyqtgraph==0.14.0
        PySocks==1.7.1
        python-dateutil==2.9.0.post0
        pytz==2026.2
        pywin32-ctypes==0.2.3
        PyYAML==6.0.3
        qrcode==8.2
        requests==2.34.2
        scipy==1.18.0
        setuptools==83.0.0
        six==1.17.0
        stevedore==5.9.0
        tqdm==4.70.1
        typing_extensions==4.16.0
        tzdata==2026.2
        urllib3==2.7.0

    - name: Build Executable
      run: |
        pyinstaller --onefile --noconsole PSP/spani_vdfBrowser.py

    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: ${{ matrix.asset_path }}