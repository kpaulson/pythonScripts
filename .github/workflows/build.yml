name: Build Cross-Platform Executables

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: spani_vdfBrowser-Windows
            asset_path: dist/spani_vdfBrowser.exe
          - os: ubuntu-latest
            artifact_name: spani_vdfBrowser-Linux
            asset_path: dist/spani_vdfBrowser
          - os: macos-latest
            artifact_name: spani_vdfBrowser-macOS
            asset_path: dist/spani_vdfBrowser

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install PyInstaller and Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller cdflib numpy pandas PyQt5 pyqtgraph scipy requests plotly

    - name: Build Executable
      run: |
        pyinstaller --onefile --noconsole PSP/spani_vdfBrowser.py

    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: ${{ matrix.asset_path }}