name: Build Executable

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install PyInstaller and Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        # If spani_vdfBrowser.py relies on external libraries, uncomment the line below:
        # if (Test-Path requirements.txt) { pip install -r requirements.txt }

    - name: Build .exe with PyInstaller
      run: |
        pyinstaller --onefile --noconsole PSP/spani_vdfBrowser.py
        # Note: If spani_vdfBrowser is a command-line tool (not a GUI), remove the '--noconsole' flag.

    - name: Upload Executable Artifact
      uses: actions/upload-artifact@v4
      with:
        name: spani_vdfBrowser-Windows
        path: dist/spani_vdfBrowser.exe